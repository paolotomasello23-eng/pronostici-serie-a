name: Promemoria pronostici

# Manda l'annuncio di apertura e i promemoria prima del blocco.
#
# Solo avvio a mano, dalla scheda Actions: per provarlo o per recuperare un
# giro saltato. La programmazione automatica sta in Supabase (pg_cron,
# migrazione 0016), perche' GitHub disattiva i workflow programmati dopo 60
# giorni senza commit — e' successo il 21 ottobre 2026 — e sotto carico ne
# salta la maggior parte.
on:
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Avvisa chi non ha ancora compilato
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            -X POST "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
