name: Promemoria pronostici

# Ogni ora: l'endpoint decide da solo se è il momento, cioè se un blocco
# cade nelle sei ore successive e qualcuno ha ancora partite in bianco.
# Chi ha già ricevuto il promemoria per quella giornata non lo riceve due
# volte, quindi far girare spesso non fa danni.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Avvisa chi non ha ancora compilato
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            -X POST "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
