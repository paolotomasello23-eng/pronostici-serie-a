name: Promemoria pronostici

# Ogni dieci minuti: e' l'endpoint a decidere se sia il momento di una delle
# tre chiamate. La piu' vicina al fischio d'inizio ha una finestra di mezz'ora,
# e con un giro all'ora la mancheremmo quasi sempre.
#
# Ogni fase parte una volta sola per giornata e per persona, quindi far girare
# spesso non produce notifiche ripetute. Dalle 5 alle 23 UTC: prima non si
# gioca, e nessun blocco cade a notte fonda.
on:
  schedule:
    - cron: "*/10 5-23 * * *"
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Avvisa chi non ha ancora compilato
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            -X POST "${{ secrets.APP_URL }}/api/cron/reminders" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
