name: Sincronizza calendario

# Aggiorna partite e orari della giornata in corso e della successiva.
#
# I sync automatici girano in Supabase (pg_cron, migrazioni 0016 e 0017).
# Questo workflow e' la rete di sicurezza: due giri al giorno, sfalsati
# rispetto a quelli di Supabase, perche' anche se quelli si fermassero le
# giornate continuino a comparire e si possano pronosticare. E' quello che
# e' mancato fra ottobre e novembre 2026.
#
# GitHub disattiva i workflow programmati dopo 60 giorni senza commit, e
# sotto carico ne salta una parte: per questo e' la riserva e non il
# principale. Si puo' sempre avviare a mano dalla scheda Actions.
on:
  schedule:
    # Minuto 23 e non 0: allo scoccare dell'ora GitHub e' piu' carico e
    # salta piu' spesso. 07:23 e 19:23 UTC.
    - cron: "23 7,19 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Aggiorna partite e orari
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 120 \
            -X POST "${{ secrets.APP_URL }}/api/cron/matches" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
