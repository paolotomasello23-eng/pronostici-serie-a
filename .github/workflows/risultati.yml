name: Sincronizza risultati

# Scarica i risultati delle giornate iniziate e ricalcola i punteggi.
#
# I sync automatici girano in Supabase (pg_cron, migrazioni 0016 e 0017).
# Questo workflow e' la rete di sicurezza: un giro al giorno, in un orario
# in cui Supabase non ne fa, cosi' la classifica si aggiorna comunque
# anche se quelli si fermassero. Si puo' sempre avviare a mano dalla
# scheda Actions.
on:
  schedule:
    - cron: "47 8 * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica risultati e ricalcola i punteggi
        run: |
          curl --fail-with-body --silent --show-error \
            --max-time 300 \
            -X POST "${{ secrets.APP_URL }}/api/cron/results" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
